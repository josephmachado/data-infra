<!DOCTYPE html>
<meta charset="UTF-8">
<style>
  .bar-wrap { display: flex; flex-direction: column; gap: 3px; }
  .bar-row  { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .bar-bg   { position: relative; height: 22px; flex: 1; background: #f5f5f5;
              border-radius: 4px; border: 0.5px solid #ddd; overflow: visible; }
  .bar-fill { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; transition: all 0.25s; }
  .bar-label { position: absolute; top: 50%; transform: translateY(-50%);
               font-size: 11px; font-weight: 500; white-space: nowrap; padding: 0 5px; }
  .legend-dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; }
  .status-pill { display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:500; }
  body { font-family: sans-serif; padding: 1rem; background: white; color: #111; }
  button { padding:6px 18px; font-size:13px; cursor:pointer; border:1px solid #ccc; border-radius:6px; background:white; }
  button:disabled { opacity: 0.4; cursor: default; }
</style>

<div style="padding: 1rem 0 0;">
  <div style="font-size: 12px; color: #555; margin-bottom: 10px;">
    Input intervals (sorted): &nbsp;
    <span id="input-list" style="font-family:monospace; color: #111;"></span>
  </div>

  <div id="bar-wrap" class="bar-wrap" style="margin-bottom: 16px;"></div>

  <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
    <div style="font-size:13px; color:#555;">
      Processing: <span id="cur-interval" style="font-family:monospace; font-weight:500; color:#111;">-</span>
    </div>
    <div style="font-size:13px; color:#555;">
      Last in result: <span id="last-result" style="font-family:monospace; font-weight:500; color:#111;">-</span>
    </div>
    <div id="status-pill" class="status-pill" style="background:#f0f0f0; color:#555;">ready</div>
  </div>

  <div style="font-size:12px; color:#555; margin-bottom:14px;" id="msg-line"></div>

  <div style="font-size: 12px; color: #555; margin-bottom: 6px;">Result so far</div>
  <div id="result-list" style="font-family:monospace; font-size:13px; color:#111; margin-bottom: 16px;"></div>

  <div style="display:flex; gap:8px; align-items:center;">
    <button onclick="prev()" id="btn-prev">&lt; prev</button>
    <button onclick="next()" id="btn-next">next &gt;</button>
    <button onclick="reset()" style="color:#555;">reset</button>
    <span style="font-size:12px; color:#999;" id="step-count"></span>
  </div>

  <div style="display:flex; gap:14px; margin-top:14px; flex-wrap:wrap;">
    <span style="font-size:11px; color:#555;"><span class="legend-dot" style="background:#B5D4F4;border:1px solid #185FA5;"></span>pending</span>
    <span style="font-size:11px; color:#555;"><span class="legend-dot" style="background:#FAC775;border:1px solid #854F0B;"></span>current</span>
    <span style="font-size:11px; color:#555;"><span class="legend-dot" style="background:#C0DD97;border:1px solid #3B6D11;"></span>in result</span>
    <span style="font-size:11px; color:#555;"><span class="legend-dot" style="background:#F7C1C1;border:1px solid #A32D2D;"></span>merged</span>
  </div>
</div>

<script>
const raw = [[1,3],[2,6],[8,10],[15,18],[9,12]];
const intervals = raw.map(iv => [...iv]).sort((a,b) => a[0]-b[0]);
const MIN = 0, MAX = 20;

function pct(v) { return ((v - MIN) / (MAX - MIN) * 100).toFixed(2) + '%'; }
function w(a,b)  { return (((b - a) / (MAX - MIN)) * 100).toFixed(2) + '%'; }

document.getElementById('input-list').textContent =
  intervals.map(iv => '[' + iv[0] + ',' + iv[1] + ']').join(', ');

const steps = [];
{
  const result = [[...intervals[0]]];
  steps.push({ type:'init', result: result.map(r=>[...r]), cur: null, curIdx: 0 });
  for (let i = 1; i < intervals.length; i++) {
    const iv = intervals[i];
    const last = result[result.length-1];
    if (iv[0] <= last[1]) {
      const oldEnd = last[1];
      steps.push({ type:'overlap', result: result.map(r=>[...r]), cur: [...iv], curIdx: i, oldEnd });
      last[1] = Math.max(last[1], iv[1]);
      steps.push({ type:'merged', result: result.map(r=>[...r]), cur: [...iv], curIdx: i });
    } else {
      steps.push({ type:'no-overlap', result: result.map(r=>[...r]), cur: [...iv], curIdx: i });
      result.push([...iv]);
      steps.push({ type:'appended', result: result.map(r=>[...r]), cur: [...iv], curIdx: i });
    }
  }
  steps.push({ type:'done', result: result.map(r=>[...r]), cur: null, curIdx: -1 });
}

let step = 0;

function render() {
  const s = steps[step];
  const wrap = document.getElementById('bar-wrap');
  wrap.innerHTML = '';

  intervals.forEach((iv, i) => {
    const row = document.createElement('div');
    row.className = 'bar-row';

    const idx = document.createElement('div');
    idx.style.cssText = 'width:22px;text-align:right;font-size:11px;color:#999;flex-shrink:0;';
    idx.textContent = '[' + i + ']';
    row.appendChild(idx);

    const bg = document.createElement('div');
    bg.className = 'bar-bg';

    const fill = document.createElement('div');
    fill.className = 'bar-fill';
    fill.style.left = pct(iv[0]);
    fill.style.width = w(iv[0], iv[1]);

    let color = '#B5D4F4', border = '#185FA5';
    if (i === s.curIdx) { color = '#FAC775'; border = '#854F0B'; }
    else if (i < s.curIdx) { color = '#C0DD97'; border = '#3B6D11'; }
    if (s.type === 'merged' && i === s.curIdx) { color = '#F7C1C1'; border = '#A32D2D'; }

    fill.style.background = color;
    fill.style.border = '1px solid ' + border;

    const lbl = document.createElement('div');
    lbl.className = 'bar-label';
    lbl.style.left = 'calc(' + pct(iv[0]) + ' + 2px)';
    lbl.style.color = border;
    lbl.textContent = '[' + iv[0] + ', ' + iv[1] + ']';

    bg.appendChild(fill);
    bg.appendChild(lbl);
    row.appendChild(bg);
    wrap.appendChild(row);
  });

  const resultBar = document.createElement('div');
  resultBar.className = 'bar-row';
  resultBar.style.marginTop = '10px';
  const rlbl = document.createElement('div');
  rlbl.style.cssText = 'width:22px;text-align:right;font-size:11px;color:#999;flex-shrink:0;';
  rlbl.textContent = '->';
  resultBar.appendChild(rlbl);
  const rbg = document.createElement('div');
  rbg.className = 'bar-bg';
  rbg.style.background = '#f5f5f5';
  s.result.forEach(rv => {
    const rf = document.createElement('div');
    rf.className = 'bar-fill';
    rf.style.left = pct(rv[0]);
    rf.style.width = w(rv[0], rv[1]);
    rf.style.background = '#EAF3DE';
    rf.style.border = '1px solid #3B6D11';
    rf.style.top = '2px';
    rf.style.bottom = '2px';
    rbg.appendChild(rf);
    const rl2 = document.createElement('div');
    rl2.className = 'bar-label';
    rl2.style.left = 'calc(' + pct(rv[0]) + ' + 2px)';
    rl2.style.color = '#27500A';
    rl2.textContent = '[' + rv[0] + ',' + rv[1] + ']';
    rbg.appendChild(rl2);
  });
  resultBar.appendChild(rbg);
  wrap.appendChild(resultBar);

  document.getElementById('cur-interval').textContent = s.cur ? '[' + s.cur[0] + ', ' + s.cur[1] + ']' : '-';
  document.getElementById('last-result').textContent = s.result.length ? '[' + s.result[s.result.length-1][0] + ', ' + s.result[s.result.length-1][1] + ']' : '-';
  document.getElementById('result-list').textContent = '[' + s.result.map(r=>'[' + r[0] + ',' + r[1] + ']').join(', ') + ']';

  const pill = document.getElementById('status-pill');
  const msg  = document.getElementById('msg-line');
  pill.style.background = '';
  pill.style.color = '';

  if (s.type === 'init') {
    pill.style.background='#f0f0f0'; pill.style.color='#555';
    pill.textContent = 'start'; msg.textContent = 'result seeded with first interval';
  } else if (s.type === 'overlap') {
    pill.style.background='#FAEEDA'; pill.style.color='#633806';
    pill.textContent = 'overlap'; msg.textContent = '[' + s.cur[0] + ', ' + s.cur[1] + '] starts before result ends - merging';
  } else if (s.type === 'merged') {
    pill.style.background='#FAEEDA'; pill.style.color='#633806';
    pill.textContent = 'merged'; msg.textContent = 'end updated to ' + s.result[s.result.length-1][1];
  } else if (s.type === 'no-overlap') {
    pill.style.background='#f0f0f0'; pill.style.color='#555';
    pill.textContent = 'no overlap'; msg.textContent = '[' + s.cur[0] + ', ' + s.cur[1] + '] starts after result ends - appending';
  } else if (s.type === 'appended') {
    pill.style.background='#EAF3DE'; pill.style.color='#27500A';
    pill.textContent = 'appended'; msg.textContent = '[' + s.cur[0] + ', ' + s.cur[1] + '] added to result';
  } else if (s.type === 'done') {
    pill.style.background='#EAF3DE'; pill.style.color='#27500A';
    pill.textContent = 'done'; msg.textContent = 'all intervals processed';
  }

  document.getElementById('step-count').textContent = 'step ' + (step+1) + ' / ' + steps.length;
  document.getElementById('btn-prev').disabled = step === 0;
  document.getElementById('btn-next').disabled = step === steps.length - 1;
}

function next()  { if (step < steps.length-1) { step++; render(); } }
function prev()  { if (step > 0) { step--; render(); } }
function reset() { step = 0; render(); }

render();
</script>
