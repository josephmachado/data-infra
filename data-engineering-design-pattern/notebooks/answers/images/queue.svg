<svg width="100%" viewBox="0 0 680 220" role="img" style="background:#ffffff; border-radius:12px; padding:8px;" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Queue (FIFO) diagram</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A visual showing how a queue works with First In, First Out ordering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text font-family="sans-serif" font-size="15" font-weight="500" fill="#111111" x="340" y="32" text-anchor="middle" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:auto">Queue — FIFO (First In, First Out)</text>

  <!-- Element 1 (front) -->
  <rect x="80" y="80" width="120" height="80" rx="6" fill="#F0EFEA" stroke="#999890" stroke-width="0.5" style="fill:rgb(240, 239, 234);stroke:rgb(153, 152, 144);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#333331" x="140" y="114" text-anchor="middle" dominant-baseline="central" style="fill:rgb(51, 51, 49);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">1</text>
  <text font-family="sans-serif" font-size="11" fill="#777777" x="140" y="136" text-anchor="middle" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">(first in)</text>

  <!-- Element 2 -->
  <rect x="210" y="80" width="120" height="80" rx="6" fill="#D1FAF0" stroke="#2EA87A" stroke-width="0.5" style="fill:rgb(209, 250, 240);stroke:rgb(46, 168, 122);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#0A5C42" x="270" y="120" text-anchor="middle" dominant-baseline="central" style="fill:rgb(10, 92, 66);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">2</text>

  <!-- Element 3 -->
  <rect x="340" y="80" width="120" height="80" rx="6" fill="#DBEAFE" stroke="#5B9BD4" stroke-width="0.5" style="fill:rgb(219, 234, 254);stroke:rgb(91, 155, 212);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#1E4D8C" x="400" y="120" text-anchor="middle" dominant-baseline="central" style="fill:rgb(30, 77, 140);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">3</text>

  <!-- Element 4 (back) -->
  <rect x="470" y="80" width="120" height="80" rx="6" fill="#EDE9FD" stroke="#8B7FD4" stroke-width="0.5" style="fill:rgb(237, 233, 253);stroke:rgb(139, 127, 212);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#3B2FA0" x="530" y="114" text-anchor="middle" dominant-baseline="central" style="fill:rgb(59, 47, 160);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">4</text>
  <text font-family="sans-serif" font-size="11" fill="#777777" x="530" y="136" text-anchor="middle" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">(last in)</text>

  <!-- Dequeue arrow -->
  <line x1="76" y1="120" x2="20" y2="120" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" style="fill:rgb(0, 0, 0);stroke:rgb(85, 85, 85);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="12" fill="#333333" x="48" y="108" text-anchor="middle" style="fill:rgb(51, 51, 51);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">dequeue()</text>
  <text font-family="sans-serif" font-size="11" fill="#777777" font-style="italic" x="48" y="142" text-anchor="middle" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">remove</text>
  <text font-family="sans-serif" font-size="11" fill="#888888" x="140" y="175" text-anchor="middle" style="fill:rgb(136, 136, 136);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">front</text>

  <!-- Enqueue arrow -->
  <line x1="624" y1="120" x2="594" y2="120" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" style="fill:rgb(0, 0, 0);stroke:rgb(85, 85, 85);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="12" fill="#333333" x="650" y="108" text-anchor="middle" style="fill:rgb(51, 51, 51);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">enqueue()</text>
  <text font-family="sans-serif" font-size="11" fill="#777777" font-style="italic" x="650" y="142" text-anchor="middle" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">add</text>
  <text font-family="sans-serif" font-size="11" fill="#888888" x="530" y="175" text-anchor="middle" style="fill:rgb(136, 136, 136);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">back</text>
</svg>