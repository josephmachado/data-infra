<svg width="100%" viewBox="0 0 680 340" role="img" style="background:#ffffff; border-radius:12px; padding:8px;" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Stack (LIFO) diagram</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A visual showing how a stack works with Last In, First Out ordering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text font-family="sans-serif" font-size="15" font-weight="500" fill="#111111" x="340" y="32" text-anchor="middle" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:auto">Stack — LIFO (Last In, First Out)</text>

  <!-- Stack frame box -->
  <rect x="220" y="55" width="240" height="230" rx="6" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4" style="fill:none;stroke:rgb(204, 204, 204);color:rgb(251, 251, 254);stroke-width:1px;stroke-dasharray:5px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Element 4 (top) -->
  <rect x="240" y="70" width="200" height="44" rx="6" fill="#EDE9FD" stroke="#8B7FD4" stroke-width="0.5" style="fill:rgb(237, 233, 253);stroke:rgb(139, 127, 212);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#3B2FA0" x="340" y="92" text-anchor="middle" dominant-baseline="central" style="fill:rgb(59, 47, 160);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">4  (last in)</text>

  <!-- Element 3 -->
  <rect x="240" y="122" width="200" height="44" rx="6" fill="#DBEAFE" stroke="#5B9BD4" stroke-width="0.5" style="fill:rgb(219, 234, 254);stroke:rgb(91, 155, 212);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#1E4D8C" x="340" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(30, 77, 140);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">3</text>

  <!-- Element 2 -->
  <rect x="240" y="174" width="200" height="44" rx="6" fill="#D1FAF0" stroke="#2EA87A" stroke-width="0.5" style="fill:rgb(209, 250, 240);stroke:rgb(46, 168, 122);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#0A5C42" x="340" y="196" text-anchor="middle" dominant-baseline="central" style="fill:rgb(10, 92, 66);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">2</text>

  <!-- Element 1 (bottom) -->
  <rect x="240" y="226" width="200" height="44" rx="6" fill="#F0EFEA" stroke="#999890" stroke-width="0.5" style="fill:rgb(240, 239, 234);stroke:rgb(153, 152, 144);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#333331" x="340" y="248" text-anchor="middle" dominant-baseline="central" style="fill:rgb(51, 51, 49);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">1  (first in)</text>

  <!-- PUSH arrow -->
  <line x1="100" y1="92" x2="236" y2="92" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" style="fill:rgb(0, 0, 0);stroke:rgb(85, 85, 85);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="12" fill="#333333" x="168" y="80" text-anchor="middle" style="fill:rgb(51, 51, 51);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">push()</text>
  <text font-family="sans-serif" font-size="11" fill="#777777" font-style="italic" x="168" y="107" text-anchor="middle" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">add to top</text>

  <!-- POP arrow -->
  <line x1="444" y1="92" x2="582" y2="92" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" style="fill:rgb(0, 0, 0);stroke:rgb(85, 85, 85);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="12" fill="#333333" x="512" y="80" text-anchor="middle" style="fill:rgb(51, 51, 51);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">pop()</text>
  <text font-family="sans-serif" font-size="11" fill="#777777" font-style="italic" x="512" y="107" text-anchor="middle" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">remove from top</text>

  <!-- Side labels — top label now on right side of push arrow -->
  <text font-family="sans-serif" font-size="11" fill="#888888" x="242" y="94" text-anchor="start" style="fill:rgb(136, 136, 136);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">top →</text>
  <text font-family="sans-serif" font-size="11" fill="#888888" x="200" y="250" text-anchor="end" style="fill:rgb(136, 136, 136);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">← bottom</text>
</svg>