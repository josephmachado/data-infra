  <circle cx="280" cy="90" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5" style="fill:rgb(250, 236, 231);stroke:rgb(216, 90, 48);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13" x="280" y="86" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">A</text>
  <text font-family="sans-serif" font-size="10" fill="#993C1D" x="280" y="102" text-anchor="middle" style="fill:rgb(153, 60, 29);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">visit 1</text>

  <!-- B — visit 2 (first branch) -->
  <circle cx="155" cy="195" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5" style="fill:rgb(250, 236, 231);stroke:rgb(216, 90, 48);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13" x="155" y="191" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">B</text>
  <text font-family="sans-serif" font-size="10" fill="#993C1D" x="155" y="207" text-anchor="middle" style="fill:rgb(153, 60, 29);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">visit 2</text>

  <!-- C — visit 5 (after backtrack) -->
  <circle cx="400" cy="195" r="28" fill="#F0EFEA" stroke="#999890" stroke-width="1.5" style="fill:rgb(240, 239, 234);stroke:rgb(153, 152, 144);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#333331" x="400" y="191" text-anchor="middle" dominant-baseline="central" style="fill:rgb(51, 51, 49);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">C</text>
  <text font-family="sans-serif" font-size="10" fill="#888780" x="400" y="207" text-anchor="middle" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">visit 5</text>

  <!-- D — visit 3 (deepest left) -->
  <circle cx="80" cy="308" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5" style="fill:rgb(250, 236, 231);stroke:rgb(216, 90, 48);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13" x="80" y="304" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">D</text>
  <text font-family="sans-serif" font-size="10" fill="#993C1D" x="80" y="320" text-anchor="middle" style="fill:rgb(153, 60, 29);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">visit 3</text>

  <!-- E — visit 4 (backtrack to B) -->
  <circle cx="228" cy="308" r="28" fill="#F0EFEA" stroke="#999890" stroke-width="1.5" style="fill:rgb(240, 239, 234);stroke:rgb(153, 152, 144);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#333331" x="228" y="304" text-anchor="middle" dominant-baseline="central" style="fill:rgb(51, 51, 49);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">E</text>
  <text font-family="sans-serif" font-size="10" fill="#888780" x="228" y="320" text-anchor="middle" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">visit 4</text>

  <!-- F — visit 6 -->
  <circle cx="332" cy="308" r="28" fill="#F0EFEA" stroke="#999890" stroke-width="1.5" style="fill:rgb(240, 239, 234);stroke:rgb(153, 152, 144);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#333331" x="332" y="304" text-anchor="middle" dominant-baseline="central" style="fill:rgb(51, 51, 49);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">F</text>
  <text font-family="sans-serif" font-size="10" fill="#888780" x="332" y="320" text-anchor="middle" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">visit 6</text>

  <!-- G — visit 7 -->
  <circle cx="495" cy="308" r="28" fill="#F0EFEA" stroke="#999890" stroke-width="1.5" style="fill:rgb(240, 239, 234);stroke:rgb(153, 152, 144);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#333331" x="495" y="304" text-anchor="middle" dominant-baseline="central" style="fill:rgb(51, 51, 49);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">G</text>
  <text font-family="sans-serif" font-size="10" fill="#888780" x="495" y="320" text-anchor="middle" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">visit 7</text>

  <!-- Traversal order strip -->
  <rect x="100" y="352" width="480" height="22" rx="4" fill="#FEF2ED" stroke="#F5C4B3" stroke-width="0.5" style="fill:rgb(254, 242, 237);stroke:rgb(245, 196, 179);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="11" fill="#712B13" x="340" y="367" text-anchor="middle" style="fill:rgb(113, 43, 19);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Order: A → B → D → E → C → F → G</text>

  <!-- Legend -->
  <circle cx="565" cy="98" r="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1" style="fill:rgb(250, 236, 231);stroke:rgb(216, 90, 48);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="11" fill="#555555" x="579" y="102" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">Active path</text>
  <circle cx="565" cy="120" r="8" fill="#F0EFEA" stroke="#999890" stroke-width="1" style="fill:rgb(240, 239, 234);stroke:rgb(153, 152, 144);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text font-family="sans-serif" font-size="11" fill="#555555" x="579" y="124" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">After backtrack</text>
  <line x1="557" y1="142" x2="573" y2="142" stroke="#F0997B" stroke-width="2.5" stroke-dasharray="5 3" style="fill:rgb(0, 0, 0);stroke:rgb(240, 153, 123);color:rgb(251, 251, 254);stroke-width:2.5px;stroke-dasharray:5px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
