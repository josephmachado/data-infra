<svg width="100%" viewBox="0 0 680 380" role="img" style="background:#ffffff; border-radius:12px;" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">DFS — Depth-First Search</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A graph showing DFS traversal order: dives deep down one branch before backtracking to explore others.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text font-family="sans-serif" font-size="15" font-weight="500" fill="#111111" x="340" y="30" text-anchor="middle" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:auto">DFS — Depth-First Search</text>
  <text font-family="sans-serif" font-size="12" fill="#777777" x="340" y="50" text-anchor="middle" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Dive deep down one branch before backtracking</text>

  <!-- Edges -->
  <line x1="270" y1="100" x2="170" y2="185" stroke="#cccccc" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(204, 204, 204);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="290" y1="100" x2="390" y2="185" stroke="#cccccc" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(204, 204, 204);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="150" y1="205" x2="90" y2="295" stroke="#cccccc" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(204, 204, 204);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="165" y1="207" x2="220" y2="295" stroke="#cccccc" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(204, 204, 204);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="390" y1="207" x2="335" y2="295" stroke="#cccccc" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(204, 204, 204);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="410" y1="207" x2="490" y2="295" stroke="#cccccc" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(204, 204, 204);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- DFS path highlight: A→B→D (left branch first) -->
  <line x1="270" y1="100" x2="170" y2="185" stroke="#F0997B" stroke-width="2.5" stroke-dasharray="6 3" style="fill:rgb(0, 0, 0);stroke:rgb(240, 153, 123);color:rgb(251, 251, 254);stroke-width:2.5px;stroke-dasharray:6px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="150" y1="205" x2="90" y2="295" stroke="#F0997B" stroke-width="2.5" stroke-dasharray="6 3" style="fill:rgb(0, 0, 0);stroke:rgb(240, 153, 123);color:rgb(251, 251, 254);stroke-width:2.5px;stroke-dasharray:6px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- backtrack B→E -->
  <line x1="165" y1="207" x2="220" y2="295" stroke="#F5C4B3" stroke-width="2" stroke-dasharray="4 4" style="fill:rgb(0, 0, 0);stroke:rgb(245, 196, 179);color:rgb(251, 251, 254);stroke-width:2px;stroke-dasharray:4px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- backtrack A→C→F→G -->
  <line x1="290" y1="100" x2="390" y2="185" stroke="#F5C4B3" stroke-width="2" stroke-dasharray="4 4" style="fill:rgb(0, 0, 0);stroke:rgb(245, 196, 179);color:rgb(251, 251, 254);stroke-width:2px;stroke-dasharray:4px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="390" y1="207" x2="335" y2="295" stroke="#F5C4B3" stroke-width="2" stroke-dasharray="4 4" style="fill:rgb(0, 0, 0);stroke:rgb(245, 196, 179);color:rgb(251, 251, 254);stroke-width:2px;stroke-dasharray:4px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="410" y1="207" x2="490" y2="295" stroke="#F5C4B3" stroke-width="2" stroke-dasharray="4 4" style="fill:rgb(0, 0, 0);stroke:rgb(245, 196, 179);color:rgb(251, 251, 254);stroke-width:2px;stroke-dasharray:4px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Level labels -->
